name: Build arm64 Release

on:
  workflow_dispatch:

jobs:
  build-arm64-release:
    runs-on: ubuntu-latest

    env:
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Build arm64 Release APK
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=arm64

      - name: Upload Release APK (arm64)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release apk (arm64)
          path: ZalithLauncher/build/outputs/apk/release/*.apk

      - name: Upload Release Mapping (arm64)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (arm64)
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt
